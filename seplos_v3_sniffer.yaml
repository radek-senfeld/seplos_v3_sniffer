substitutions:
  name: seplos-bms
  pack0: "bms0"
  pack0_name: "BMS 1"
  pack1: "bms1"
  pack1_name: "BMS 2"
  pack2: "bms2"
  pack2_name: "BMS 3"
  pack3: "bms3"
  pack3_name: "BMS 4"
  device_description: "Monitor multiple Seplos V3 BMSes via RS-485"
  time: "3" # update interval for all data points

esphome:
  name: ${name}
  comment: ${device_description}

external_components:
  - source:
      type: git
      url: https://github.com/radek-senfeld/seplos_v3_sniffer

esp8266:
  board: nodemcuv2

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  platform: esphome

logger:
  #level: INFO
  baud_rate: 0

api:

uart:
- id: seplos
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 19200

seplos_parser:
  id: seplos_v3
  bms_count: 2
  update_interval: ${time}
  uart_id: seplos

sensor:
  # bms0
  - platform: seplos_parser
    seplos_parser_id: seplos_v3
    id: ${pack0}_pack_voltage
    name: ${pack0_name} Pack Voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - throttle: ${time}s
  - platform: seplos_parser
    seplos_parser_id: seplos_v3
    id: ${pack0}_current
    name: ${pack0_name} Current
    unit_of_measurement: "A"
    accuracy_decimals: 2
    filters:
      - throttle: ${time}s
  - platform: seplos_parser
    seplos_parser_id: seplos_v3
    id: ${pack0}_remaining_capacity
    name: ${pack0_name} Remaining Capacity
    unit_of_measurement: "Ah"
    accuracy_decimals: 2
    filters:
      - throttle: ${time}s
  - platform: seplos_parser
    seplos_parser_id: seplos_v3
    id: ${pack0}_total_capacity
    name: ${pack0_name} Total Capacity
    unit_of_measurement: "Ah"
    accuracy_decimals: 2
    filters:
      - throttle: ${time}s
  - platform: seplos_parser
    seplos_parser_id: seplos_v3
    id: ${pack0}_total_discharge_capacity
    name: ${pack0_name} Total Discharge Capacity
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - throttle: ${time}s
  - platform: seplos_parser
    seplos_parser_id: seplos_v3
    id: ${pack0}_soc
    name: ${pack0_name} State of Charge
    unit_of_measurement: "%"
    accuracy_decimals: 1
    filters:
      - throttle: ${time}s
  - platform: seplos_parser
    seplos_parser_id: seplos_v3
    id: ${pack0}_soh
    name: ${pack0_name} State of Health
    unit_of_measurement: "%"
    accuracy_decimals: 1
    filters:
      - throttle: ${time}s
  - platform: seplos_parser
    seplos_parser_id: seplos_v3
    id: ${pack0}_cycle_count
    name: ${pack0_name} Cycle Count
    unit_of_measurement: "cycles"
    accuracy_decimals: 0
    filters:
      - throttle: ${time}s
  - platform: seplos_parser
    seplos_parser_id: seplos_v3
    id: ${pack0}_average_cell_voltage
